<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>영화 평점 서비스 - 5주차 API 연결</title>
    <style>
      body { font-family: sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
      section { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
      h2 { margin-top: 0; font-size: 18px; }
      code { background: #f4f4f4; padding: 2px 6px; border-radius: 4px; }
      input { padding: 6px; margin-right: 6px; }
      button { padding: 6px 12px; cursor: pointer; }
      pre { background: #f8f8f8; padding: 12px; border-radius: 6px; white-space: pre-wrap; min-height: 20px; }
    </style>
  </head>
  <body>
    <h1>영화 평점 서비스</h1>
    <p>서버 주소: <code id="base"></code></p>

    <section>
      <h2>1. 닉네임 중복 체크</h2>
      <p><code>GET /members/nickname/{nickname}</code></p>
      <input id="nickname" value="수현" placeholder="닉네임" />
      <button onclick="checkNickname()">중복 체크</button>
      <pre id="nicknameResult"></pre>
    </section>

    <section>
      <h2>2. 이메일 중복 체크</h2>
      <p><code>GET /members/email/{email}</code></p>
      <input id="email" value="noco@umc.com" placeholder="이메일" />
      <button onclick="checkEmail()">중복 체크</button>
      <pre id="emailResult"></pre>
    </section>

    <section>
      <h2>3. 유저별 평점 조회</h2>
      <p><code>GET /members/{memberId}/ratings</code></p>
      <input id="memberId" type="number" value="1" placeholder="memberId" />
      <button onclick="getRatings()">조회</button>
      <pre id="ratingsResult"></pre>
    </section>

    <script>
      const BASE_URL = "http://localhost:3000";
      document.getElementById("base").innerText = BASE_URL;

      async function call(path, resultId) {
        const out = document.getElementById(resultId);
        out.innerText = "요청 중...";
        try {
          const res = await fetch(BASE_URL + path);
          const data = await res.json();
          out.innerText = `${res.status}\n` + JSON.stringify(data, null, 2);
        } catch (e) {
          out.innerText = "요청 실패: " + e.message;
        }
      }

      function checkNickname() {
        const nickname = document.getElementById("nickname").value;
        call(`/members/nickname/${encodeURIComponent(nickname)}`, "nicknameResult");
      }

      function checkEmail() {
        const email = document.getElementById("email").value;
        call(`/members/email/${encodeURIComponent(email)}`, "emailResult");
      }

      function getRatings() {
        const memberId = document.getElementById("memberId").value;
        call(`/members/${memberId}/ratings`, "ratingsResult");
      }
    </script>
  </body>
</html>
