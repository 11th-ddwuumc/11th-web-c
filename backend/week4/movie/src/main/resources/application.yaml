spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:umc_movie}?connectionTimeZone=Asia/Seoul
    username: ${DB_USER:root}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  mvc:
    problemdetails:
      enabled: true

server:
  port: 8080

app:
  cors:
    enabled: ${CORS_ENABLED:true}
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}